<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fichareido - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark text-light text-center p-4">
    <section id="Cabecalho_Index">
      <header
        id="Botoes_Cabecalho"
        class="bg-secondary p-3 rounded text-center"
      >
        <a href="/frontend/Index.html" class="btn btn-light m-1">Início</a>
        <a href="Login.html" class="btn btn-light m-1">Login / Cadastrar-se</a>
        <a href="Fichas.html" class="btn btn-light m-1">Fichas</a>
        <a href="Criacao.html" class="btn btn-light m-1">Criação de fichas</a>
      </header>
    </section>

    <main class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card bg-secondary text-light p-4">
            <h2 class="mb-4">Login</h2>
            <form id="formLogin">
              <!-- Aqui -->
              <div class="mb-3">
                <label for="emailLogin" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="emailLogin"
                  name="email"
                  placeholder="Digite seu email"
                />
              </div>
              <div class="mb-3">
                <label for="senhaLogin" class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="senhaLogin"
                  name="senha"
                  placeholder="Digite sua senha"
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Entrar
              </button>
            </form>
          </div>
        </div>

        <div class="col-md-5 mt-4 mt-md-0">
          <div class="card bg-secondary text-light p-4">
            <h2 class="mb-4">Cadastrar-se</h2>
            <form id="formCadastro">
              <!-- Aqui -->
              <div class="mb-3">
                <label for="nomeCadastro" class="form-label"
                  >Nome de Usuário</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="nomeCadastro"
                  name="username"
                  placeholder="Seu nome completo"
                />
              </div>
              <div class="mb-3">
                <label for="emailCadastro" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="emailCadastro"
                  name="email"
                  placeholder="Seu email"
                />
              </div>
              <div class="mb-3">
                <label for="senhaCadastro" class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="senhaCadastro"
                  name="senha"
                  placeholder="Crie uma senha"
                />
              </div>
              <button type="submit" class="btn btn-success w-100">
                Cadastrar
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="/frontend/JS/login.js"></script>
  </body>
</html>
