<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fichareido - Fichas</title>
    <!-- Boosttrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link href="/frontend/Arquivos_Css/Criacao.css" rel="stylesheet" />
  </head>
  <body class="bg-dark text-light p-4">
    <section id="Cabecalho_Index">
      <header
        id="Botoes_Cabecalho"
        class="bg-secondary p-3 rounded text-center"
      >
        <a href="/frontend/Index.html" class="btn btn-light m-1">Início</a>
        <a href="Login.html" class="btn btn-light m-1">Login / Cadastrar-se</a>
        <a href="Fichas.html" class="btn btn-light m-1">Fichas</a>
        <a href="Criacao.html" class="btn btn-light m-1">Criação de fichas</a>
      </header>
    </section>
    <main class="container-fluid mt-3">
      <div class="row min-vh-100">
        <nav id="menu-lateral" class="col-3 bg-secondary p-3">
          <h5>Modificações</h5>
          <ul class="lista-comandos">
            <li>
              <input
                type="text"
                id="nomeCampo"
                placeholder="Nome do campo"
                class="form-control mb-2"
              />
            </li>
            <li>
              <button
                class="btn btn-light w-100 mb-2"
                data-bs-toggle="modal"
                data-bs-target="#modalCampo"
              >
                Adicionar campo
              </button>
            </li>
            <li>
              <button id="btnSalvar" class="btn btn-light w-100">
                Salvar ficha
              </button>
            </li>
          </ul>
        </nav>

        <section
          id="pagina-ficha"
          class="col-9 bg-light text-dark p-4"
        ></section>
      </div>
    </main>
    <div class="modal fade" id="modalCampo" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-dark">
          <div class="modal-header">
            <h5 class="modal-title">Tipo de campo</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <p>Escolha o tipo do campo:</p>

            <button id="campoTexto" class="btn btn-secondary w-100 mb-2">
              Texto
            </button>

            <button id="campoNumero" class="btn btn-secondary w-100">
              Número
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/JS/criacao_campo.js"></script>
</html>
